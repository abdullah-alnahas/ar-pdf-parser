name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU-only torch wheel: avoids pulling the NVIDIA CUDA bundle
      # (proprietary EULA, fails the project's license audit). Phase-4
      # CI requirement; the project ships no GPU code, so CPU torch is
      # the canonical install target.
      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + ml + dev extras
        run: |
          pip install -e ".[ml,dev]"

      - name: Lint
        run: make lint

      - name: License audit (runtime)
        run: make audit

      - name: License audit (with [ml] extra)
        run: python tools/license_audit.py --include-extras=ml

      - name: Tests
        run: make test
