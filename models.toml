# Pinned Hugging Face model registry.
#
# Each entry pins a Hugging Face model by commit revision (not a floating
# tag) and records its license. The license-audit harness
# (tools/license_audit.py) validates that every entry's license is in the
# project's allow-list (MIT, Apache-2.0, BSD, ISC, MPL-2.0, PSF-2.0,
# Unlicense, 0BSD).
#
# Schema (validated by tools/license_audit.py):
#
#   [[models]]
#   name      = "owner/repo"           # required
#   revision  = "<commit-sha>"         # required, pinned commit hash
#   license   = "Apache-2.0"           # required, must be in allow-list
#   stage     = "layout" | "ocr"       # required, which pipeline stage
#   footprint_mb = 0                   # optional, on-disk size
#   source_url = "https://..."         # optional, model card URL

[[models]]
name = "cmarkea/dit-base-layout-detection"
revision = "1995237326c8b53d93525b7b19e20bb363b4eb73"
license = "Apache-2.0"
stage = "layout"
footprint_mb = 330
source_url = "https://huggingface.co/cmarkea/dit-base-layout-detection"

[[models]]
# Issue #26: GOT-OCR-2.0-hf was trained almost exclusively on
# English/Chinese document corpora; it had no real Arabic coverage and
# fell back to LaTeX-math-italic substitutions (U+1D400 block) for
# every Arabic glyph, producing unusable output. Swapped to
# Qwen2-VL-2B-Instruct: Apache-2.0, multilingual training corpus with
# real Arabic, ~4 GB fp16 footprint (fits 6 GB GPU alongside the DiT
# layout model with a small headroom for activations).
name = "Qwen/Qwen2-VL-2B-Instruct"
revision = "895c3a49bc3fa70a340399125c650a463535e71c"
license = "Apache-2.0"
stage = "ocr"
footprint_mb = 4400
source_url = "https://huggingface.co/Qwen/Qwen2-VL-2B-Instruct"
