[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "arabic-pdf-transcribe"
description = "Arabic-first PDF transcriber: native text extraction with ML fallback for layout and OCR. Emits Markdown and Word."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Abdullah Al Nahas" }]
# Python 3.11+ is required because the license-audit harness uses ``tomllib``
# from the standard library (stdlib since 3.11). Spec / plan originally said
# ">=3.10"; the bump was accepted as part of phase-1 multi-agent review and
# is documented in the plan's "Expert Review" iteration-1 section.
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Natural Language :: Arabic",
]
dependencies = [
    "pypdfium2==4.30.0",
    "python-docx==1.1.2",
]

[project.optional-dependencies]
ml = [
    "huggingface-hub==0.26.2",
    # transformers must support GOT-OCR-2.0 (model_type ``got_ocr2``),
    # which landed in 4.49.0. The previous pin (4.46.3) silently
    # mis-loaded the OCR model: ``AutoProcessor`` returned only the
    # tokenizer and ``AutoModelForImageTextToText`` raised
    # "model type 'got_ocr2' not recognized". See issue #16.
    # Pinned to the exact validated version to match the
    # exact-pin convention used by every other entry in the
    # ``[ml]`` extra (torch, torchvision, Pillow, huggingface-hub).
    "transformers==4.49.0",
    "torch==2.5.1",
    # torchvision must match torch's C++ ABI: torchvision 0.20.1 is the
    # release built against torch 2.5.1 (per the upstream compatibility
    # matrix). Without an explicit pin, pip resolves a torchvision wheel
    # built for a different torch ABI, which surfaces as
    # ``operator torchvision::nms does not exist`` when ``transformers``
    # imports torchvision via the layout model's image processor.
    "torchvision==0.20.1",
    "Pillow==11.0.0",
]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "coverage==7.6.10",
    "reportlab==4.2.5",
]

[project.scripts]
arabic-pdf-transcribe = "arabic_pdf_transcribe.cli:main"

[project.urls]
Repository = "https://github.com/abdullah-alnahas/ar-pdf-parser"

[tool.hatch.version]
path = "src/arabic_pdf_transcribe/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/arabic_pdf_transcribe"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B008", "RUF001", "RUF002", "RUF003"]
# An Arabic-PDF transcriber legitimately contains Arabic glyphs in
# source; the ambiguous-character lints (RUF001 / RUF002) treat
# Arabic digits and dashes as suspicious because they resemble
# Western punctuation — but matching those characters is the whole
# point of this codebase. Suppress where the glyph is intended.
"src/arabic_pdf_transcribe/roles/*" = ["RUF001", "RUF002"]
"src/arabic_pdf_transcribe/validate/*" = ["RUF001", "RUF002"]
"src/arabic_pdf_transcribe/emit/*" = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not slow",
]
markers = [
    "slow: marks tests as slow (skipped by default; run with --run-slow)",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["arabic_pdf_transcribe"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
